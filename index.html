'use strict';
const c=document.getElementById('screen'),ctx=c.getContext('2d',{alpha:false}),mic=document.getElementById('mic'),demoBtn=document.getElementById('demo'),full=document.getElementById('full'),status=document.getElementById('status'),calBtn=document.getElementById('cal'),resetBtn=document.getElementById('reset'),modeBtn=document.getElementById('mode');
let W=0,H=0,C=0,R=0,cw=0,ch=0,history=[],demo=true,analyser=null,data=null,audio=null,stream=null,last=0,acc=0,simTime=0,hideTimer=null;
const PERIOD=64,MINHZ=40,MAXHZ=12000;
let viewMode=0,flowLast=0,flowAccumulator=0,flowTime=0;
let flowGradient=null,flowGradientWidth=0;

let rawLevels=new Float32Array(0),blendedLevels=new Float32Array(0);
// Optional room-noise calibration. WITHOUT a saved profile the original v9.1
// FFT-to-digit algorithm runs unchanged. No new filterbank or analyser.
const NOISE_KEY='matrix-spectrum-v9-2-room-noise';
const NOISE_TIME_MS=3000,NOISE_LOW_DB=3,NOISE_HIGH_DB=12;
let noiseProfile=null,calibration=null,calibrationStart=0;
function loadNoiseProfile(){

  const p=JSON.parse(localStorage.getItem(NOISE_KEY));

 }catch(e){return null}
}
noiseProfile=loadNoiseProfile();
function noiseDbAt(x){
 // Store the profile on the relative logarithmic axis so it survives resize.
 const arr=noiseProfile.db,f=(x+.5)*arr.length/C-.5;
 const a=Math.max(0,Math.min(arr.length-1,Math.floor(f)));
 const b=Math.min(arr.length-1,a+1),t=Math.max(0,Math.min(1,f-a));
 return arr[a]*(1-t)+arr[b]*t;
}
function updateNoiseButtons(){

 resetBtn.disabled=!!calibration;
}
function finishCalibration(){
 if(!calibration||!calibration.length)return;

 updateNoiseButtons();showControls();

// A separate, low-resolution light field: digits retain exactly the v5 palette.

const GLOW_STRENGTH=.34; // adjust only the ambient light, never digit colors

function makeGlyphs(){

  // Render glow once into each cached tile, not every animation frame.
  const tile=document.createElement('canvas');tile.width=Math.ceil(cw*d);tile.height=Math.ceil(ch*d);
  const g=tile.getContext('2d');g.scale(d,d);
  g.font=`${font}px monospace`;g.textAlign='center';g.textBaseline='middle';
  const light=v===0?18:Math.min(75,24+v*5.3);
  const saturation=v===0?38:Math.min(83,60+v*2);
  const ink=`hsl(${137-v*.5} ${saturation}% ${light}%)`;
  if(v>0){
   g.shadowColor=`hsla(136,95%,58%,${(.10+v*.045).toFixed(3)})`;

function showControls(){document.body.classList.remove('hidden');clearTimeout(hideTimer);hideTimer=setTimeout(()=>document.body.classList.add('hidden'),6500)}

function resize(){if(calibration){calibration=null;status.textContent="Калибровка прервана изменением размера экрана";updateNoiseButtons()}flowGradient=null;W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,1.5);c.width=Math.round(W*d);c.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);cw=Math.max(9,Math.min(18,Math.round(W/88)));ch=Math.round(cw*1.36);const old=history,oldC=C;C=Math.ceil(W/cw);R=Math.ceil(H/ch)+2;history=old.slice(0,R).map(row=>Array.from({length:C},(_,i)=>row[Math.min(oldC-1,Math.floor(i*oldC/C))]||0));while(history.length<R)history.push(new Uint8Array(C));prevLevels=new Float32Array(C);floorLevels=new Float32Array(C);rawLevels=new Float32Array(C);blendedLevels=new Float32Array(C);makeGlyphs();glowCanvas.width=C;glowCanvas.height=R;glowImage=glowCtx.createImageData(C,R);glowPixels=glowImage.data;glowDirty=true;ctx.font=`${Math.round(cw*.91)}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle'}

   if(a<=b){for(let k=a;k<=b;k++)peak=Math.max(peak,data[k])}
   else{let k=Math.min(data.length-1,Math.max(1,Math.round(Math.sqrt(lo*hi)/hz)));peak=data[k]}

    // Above the calibrated noise by 12 dB, original v9.1 level is exact.

   const yy=y+dy;if(yy<0||yy>=R)continue;
   const row=history[yy];

    const xx=x+dx;if(xx<0||xx>=C)continue;

   }

function draw(){ctx.fillStyle='#000000';ctx.fillRect(0,0,W,H);

}

// Liquid Ribbons v2: ONLY this renderer is changed. Matrix v9.2 stays intact.
// One coherent, smooth displacement field for all 11 filaments.
const FLOW_BANDS=18,FLOW_LINES=11,FLOW_SAMPLE_MS=40;
const flowTarget=new Float32Array(FLOW_BANDS),flowLevel=new Float32Array(FLOW_BANDS);
const flowCurve=new Float32Array(128),flowSmooth=new Float32Array(128);
const FLOW_POINTS=128;
const flowY=new Float32Array(FLOW_POINTS),flowEnergy=new Float32Array(FLOW_POINTS);
function flowSpectrum(){
 if(analyser&&!demo){
  analyser.getFloatFrequencyData(data);
  const binHz=audio.sampleRate/analyser.fftSize;
  const max=Math.min(MAXHZ,audio.sampleRate*.47);
  for(let i=0;i<FLOW_BANDS;i++){
   const lo=MINHZ*Math.pow(max/MINHZ,i/FLOW_BANDS),hi=MINHZ*Math.pow(max/MINHZ,(i+1)/FLOW_BANDS);
   const a=Math.max(1,Math.ceil(lo/binHz)),b=Math.min(data.length-1,Math.ceil(hi/binHz)-1);
   let peak=-120;
   if(a<=b){for(let k=a;k<=b;k++)peak=Math.max(peak,data[k])}
   else peak=data[Math.min(data.length-1,Math.max(1,Math.round(Math.sqrt(lo*hi)/binHz)))];
   let level=Math.max(0,Math.min(1,(peak+83)/59));
   if(noiseProfile&&!calibration){
    const f=(i+.5)*noiseProfile.db.length/FLOW_BANDS-.5;
    const a0=Math.max(0,Math.min(noiseProfile.db.length-1,Math.floor(f)));
    const b0=Math.min(noiseProfile.db.length-1,a0+1),t0=Math.max(0,Math.min(1,f-a0));

    const t=Math.max(0,Math.min(1,(peak-noise-NOISE_LOW_DB)/(NOISE_HIGH_DB-NOISE_LOW_DB)));
    level*=t*t*(3-2*t);
   }
   // A real quiet room or calibrated silence yields a straight ribbon.
   flowTarget[i]=Math.pow(Math.max(0,(level-.09)/.91),1.03);
  }

  const beat=Math.pow(Math.max(0,Math.sin(flowTime*4.4)),10);
  const hat=Math.pow(Math.max(0,Math.sin(flowTime*9.2+1)),14);
  for(let i=0;i<FLOW_BANDS;i++){
   const q=(i+.5)/FLOW_BANDS;
   const bass=beat*.98*Math.exp(-Math.pow((q-.15)/.11,2));
   const mid=(.30+.22*Math.sin(flowTime*1.8))*Math.exp(-Math.pow((q-.50)/.15,2));
   const high=hat*.65*Math.exp(-Math.pow((q-.82)/.10,2));

function flowUpdate(dt){

}
function flowBuildCurve(){
 // A broad Gaussian kernel removes column-shaped response. Its support is
 // ~5 bands (instead of many narrow, independent wiggles).

  const f=i*(FLOW_BANDS-1)/(FLOW_POINTS-1);
  let sum=0,wsum=0;
  for(let k=Math.max(0,Math.floor(f)-5);k<=Math.min(FLOW_BANDS-1,Math.ceil(f)+5);k++){
   const z=(k-f)/1.75,w=Math.exp(-.5*z*z);
   sum+=flowLevel[k]*w;wsum+=w;
  }
  flowCurve[i]=wsum?sum/wsum:0;

 // instruments: a wide maximum envelope gently merges close responses.

  let localMax=0;
  for(let j=-9;j<=9;j+=3){
   const k=Math.max(0,Math.min(FLOW_POINTS-1,i+j));
   if(flowCurve[k]>localMax)localMax=flowCurve[k];

function drawFlow(){

  flowGradient.addColorStop(.38,'#3ce58a');

function setMode(next){

 if(!viewMode){last=0;acc=0;glowDirty=true}

}

  flowTime+=dt;flowAccumulator+=dt*1000;
  if(flowAccumulator>=FLOW_SAMPLE_MS){if(calibration)sample();flowSpectrum();flowAccumulator%=FLOW_SAMPLE_MS}
  flowUpdate(dt);drawFlow();requestAnimationFrame(frame);return;

  for(let i=0;i<n;i++)history.unshift(i?row.slice():row);

demoBtn.onclick=()=>{if(calibration){calibration=null;status.textContent='Калибровка отменена'}demo=!demo;demoBtn.textContent='Демо: '+(demo?'ВКЛ':'ВЫКЛ');status.textContent=demo?'Симуляция звука':analyser?'Микрофон активен'+(noiseProfile?' · шум откалиброван':''):'Тишина — включи микрофон';updateNoiseButtons();showControls()};
mic.onclick=async()=>{if(calibration)calibration=null;showControls();mic.disabled=true;status.textContent='Запрашиваю разрешение…';
 try{if(!window.isSecureContext)throw Error('Открой сайт по HTTPS, а не файл из памяти');if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Error('Браузер не поддерживает микрофон. Попробуй Chrome.');

 analyser=audio.createAnalyser();analyser.fftSize=8192;analyser.smoothingTimeConstant=.12;analyser.minDecibels=-100;analyser.maxDecibels=-10;audio.createMediaStreamSource(stream).connect(analyser);data=new Float32Array(analyser.frequencyBinCount);
 demo=false;demoBtn.textContent='Демо: ВЫКЛ';mic.textContent='🎙 Микрофон ✓';status.textContent='Микрофон активен. Звук улавливается из комнаты.';
 // Display effective settings if Android exposes them; requested settings are not proof.
 const micSettings=stream.getAudioTracks()[0].getSettings?.()||{};
 const flags=[['EC','echoCancellation'],['NS','noiseSuppression'],['AGC','autoGainControl']]
  .map(([label,key])=>`${label}: ${typeof micSettings[key]==='boolean'?(micSettings[key]?'ВКЛ':'выкл'):'н/д'}`);
 status.textContent+=' '+flags.join(' · ')+(noiseProfile?' · шум откалиброван':'');
 console.info('Matrix Spectrum / Spectral Flow — microphone getSettings()',micSettings);
 stream.getAudioTracks()[0].onended=()=>{analyser=null;calibration=null;status.textContent='Микрофон отключён';updateNoiseButtons();showControls()}
 }catch(e){status.textContent='Ошибка: '+(e.name==='NotAllowedError'?'Нет разрешения. Разреши микрофон в настройках сайта.':e.message);console.error(e)}
 finally{mic.disabled=false;updateNoiseButtons();showControls()}};
calBtn.onclick=()=>{
 if(!analyser||demo||calibration)return;
 calibration=[];calibrationStart=performance.now();
 status.textContent='Калибровка фона: 3 с. Не включай музыку и не говори.';
 updateNoiseButtons();showControls();
};
resetBtn.onclick=()=>{
 calibration=null;noiseProfile=null;
 try{localStorage.removeItem(NOISE_KEY)}catch(e){}
 status.textContent='Профиль шума сброшен. Работает обычная v9.1.';
 updateNoiseButtons();showControls();
};
updateNoiseButtons();
full.onclick=async()=>{try{if(!document.fullscreenElement){if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else throw Error('В этом браузере полноэкранный режим недоступен')}else await document.exitFullscreen()}catch(e){status.textContent=e.message+' — попробуй «Добавить на главный экран».'}showControls()};
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
