<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b09"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>Matrix Spectrum v3</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b09;color:#a3ffb8;font-family:monospace}canvas{display:block;width:100%;height:100%;touch-action:manipulation}#panel{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:96vw;background:#07110df2;border:1px solid #25563a;border-radius:12px;padding:10px;transition:opacity .35s}button{font:13px monospace;background:#123622;color:#c2ffd3;border:1px solid #397d50;border-radius:7px;padding:10px;cursor:pointer}#status{font-size:12px;max-width:310px;overflow-wrap:anywhere;color:#8fcca2}#hint{position:fixed;top:12px;right:12px;color:#42664b;font:11px monospace;pointer-events:none}body.hidden #panel{opacity:0;pointer-events:none}body.hidden #hint{opacity:0}@media(max-width:600px){#panel{width:94vw}}
</style></head><body><canvas id="screen"></canvas><div id="hint">Коснись экрана — управление</div><div id="panel"><button id="mic">🎙 Микрофон</button><button id="demo">Демо: ВКЛ</button><button id="full">⛶ На весь экран</button><span id="status">Демо. Для микрофона нужен HTTPS.</span></div><script>
'use strict';
const c=document.getElementById('screen'),ctx=c.getContext('2d',{alpha:false}),mic=document.getElementById('mic'),demoBtn=document.getElementById('demo'),full=document.getElementById('full'),status=document.getElementById('status');
let W=0,H=0,C=0,R=0,cw=0,ch=0,history=[],demo=true,analyser=null,data=null,audio=null,stream=null,last=0,acc=0,simTime=0,hideTimer=null;
const PERIOD=85,MINHZ=40,MAXHZ=12000;
function showControls(){document.body.classList.remove('hidden');clearTimeout(hideTimer);hideTimer=setTimeout(()=>document.body.classList.add('hidden'),6500)}
c.addEventListener('click',showControls);
function resize(){W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,1.5);c.width=Math.round(W*d);c.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);cw=Math.max(13,Math.min(21,Math.round(W/57)));ch=Math.round(cw*1.36);const old=history,oldC=C;C=Math.ceil(W/cw);R=Math.ceil(H/ch)+2;history=old.slice(0,R).map(row=>Array.from({length:C},(_,i)=>row[Math.min(oldC-1,Math.floor(i*oldC/C))]||0));while(history.length<R)history.push(new Uint8Array(C));ctx.font=`${Math.round(cw*.91)}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle'}
addEventListener('resize',resize);resize();
function sample(){const row=new Uint8Array(C);
 if(analyser&&!demo){analyser.getFloatFrequencyData(data);const hz=audio.sampleRate/analyser.fftSize,max=Math.min(MAXHZ,audio.sampleRate*.47);
  for(let x=0;x<C;x++){const lo=MINHZ*Math.pow(max/MINHZ,x/C),hi=MINHZ*Math.pow(max/MINHZ,(x+1)/C);
   let a=Math.max(1,Math.ceil(lo/hz)),b=Math.min(data.length-1,Math.ceil(hi/hz)-1),peak=-120;
   if(a<=b){for(let k=a;k<=b;k++)peak=Math.max(peak,data[k])}
   else{let k=Math.min(data.length-1,Math.max(1,Math.round(Math.sqrt(lo*hi)/hz)));peak=data[k]}
   const level=Math.max(0,Math.min(1,(peak+76)/55));row[x]=Math.round(Math.pow(level,1.3)*9)}
  return row}
 if(!demo)return row;
 simTime+=PERIOD/1000;const beat=Math.pow(Math.max(0,Math.sin(simTime*5.1)),10),hat=Math.pow(Math.max(0,Math.sin(simTime*10.2+1)),15);
 for(let x=0;x<C;x++){const q=x/C;const bass=beat*8*Math.exp(-Math.pow((q-.13)/.09,2)),mid=(2+1.5*Math.sin(simTime*2+q*22))*Math.exp(-Math.pow((q-.48)/.15,2)),high=hat*8*Math.exp(-Math.pow((q-.82)/.08,2));row[x]=Math.max(0,Math.min(9,Math.round(bass+mid+high+(Math.random()-.5)*.8)))}return row}
function draw(){ctx.fillStyle='#070b09';ctx.fillRect(0,0,W,H);ctx.font=`${Math.round(cw*.91)}px monospace`;
 // After a new row is inserted, it starts above the viewport and glides down.
 const offset=acc/PERIOD-1;
 for(let y=0;y<history.length;y++){const yy=(y+offset)*ch+ch/2;if(yy< -ch||yy>H+ch)continue;const row=history[y],fade=Math.max(.15,1-y/(R+5));
  for(let x=0;x<C;x++){const v=row[x],light=v===0?13:22+v*6;ctx.fillStyle=`hsla(${137-v*.7},${65+v*2}%,${light}%,${.3+.7*fade})`;ctx.fillText(v,x*cw+cw/2,yy)}}
 const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#07140a00');grad.addColorStop(1,'#03070599');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H)}
function frame(now){if(!last)last=now;acc+=Math.min(180,Math.max(0,now-last));last=now;let n=0;while(acc>=PERIOD&&n++<3){history.unshift(sample());history.length=R;acc-=PERIOD}if(acc>=PERIOD)acc%=PERIOD;draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
demoBtn.onclick=()=>{demo=!demo;demoBtn.textContent='Демо: '+(demo?'ВКЛ':'ВЫКЛ');status.textContent=demo?'Симуляция звука':analyser?'Микрофон активен':'Тишина — включи микрофон';showControls()};
mic.onclick=async()=>{showControls();mic.disabled=true;status.textContent='Запрашиваю разрешение…';
 try{if(!window.isSecureContext)throw Error('Открой сайт по HTTPS, а не файл из памяти');if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Error('Браузер не поддерживает микрофон. Попробуй Chrome.');
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});
 if(audio)await audio.close();audio=new (window.AudioContext||window.webkitAudioContext)();await audio.resume();
 analyser=audio.createAnalyser();analyser.fftSize=8192;analyser.smoothingTimeConstant=.12;analyser.minDecibels=-100;analyser.maxDecibels=-10;audio.createMediaStreamSource(stream).connect(analyser);data=new Float32Array(analyser.frequencyBinCount);
 demo=false;demoBtn.textContent='Демо: ВЫКЛ';mic.textContent='🎙 Микрофон ✓';status.textContent='Микрофон активен. Звук улавливается из комнаты.';
 stream.getAudioTracks()[0].onended=()=>{analyser=null;status.textContent='Микрофон отключён';showControls()}
 }catch(e){status.textContent='Ошибка: '+(e.name==='NotAllowedError'?'Нет разрешения. Разреши микрофон в настройках сайта.':e.message);console.error(e)}
 finally{mic.disabled=false;showControls()}};
full.onclick=async()=>{try{if(!document.fullscreenElement){if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else throw Error('В этом браузере полноэкранный режим недоступен')}else await document.exitFullscreen()}catch(e){status.textContent=e.message+' — попробуй «Добавить на главный экран».'}showControls()};
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
showControls();
</script></body></html>
