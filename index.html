<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: light)"><meta name="color-scheme" content="dark"><meta name="supported-color-schemes" content="dark"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>Matrix Spectrum v9.1</title><style>
:root{color-scheme:dark;background:#000000}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000000;color:#a3ffb8;font-family:monospace}canvas{display:block;width:100%;height:100%;touch-action:manipulation}#panel{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:96vw;background:#07110df2;border:1px solid #25563a;border-radius:12px;padding:10px;transition:opacity .35s}button{font:13px monospace;background:#123622;color:#c2ffd3;border:1px solid #397d50;border-radius:7px;padding:10px;cursor:pointer}#status{font-size:12px;max-width:310px;overflow-wrap:anywhere;color:#8fcca2}#hint{position:fixed;top:12px;right:12px;color:#42664b;font:11px monospace;pointer-events:none}body.hidden #panel{opacity:0;pointer-events:none}body.hidden #hint{opacity:0}@media(max-width:600px){#panel{width:94vw}}
</style></head><body><canvas id="screen"></canvas><div id="hint">Коснись экрана — управление</div><div id="panel"><button id="mic">🎙 Микрофон</button><button id="demo">Демо: ВКЛ</button><button id="full">⛶ На весь экран</button><span id="status">Демо. Для микрофона нужен HTTPS.</span></div><script>
'use strict';
const c=document.getElementById('screen'),ctx=c.getContext('2d',{alpha:false}),mic=document.getElementById('mic'),demoBtn=document.getElementById('demo'),full=document.getElementById('full'),status=document.getElementById('status');
let W=0,H=0,C=0,R=0,cw=0,ch=0,history=[],demo=true,analyser=null,data=null,audio=null,stream=null,last=0,acc=0,simTime=0,hideTimer=null;
const PERIOD=64,MINHZ=40,MAXHZ=12000;
let prevLevels=new Float32Array(0),floorLevels=new Float32Array(0),glyphs=[];
let rawLevels=new Float32Array(0),blendedLevels=new Float32Array(0);
// A separate, low-resolution light field: digits retain exactly the v5 palette.
const glowCanvas=document.createElement('canvas'),glowCtx=glowCanvas.getContext('2d');
let glowImage=null,glowPixels=null,glowDirty=true;
const GLOW_STRENGTH=.34; // adjust only the ambient light, never digit colors

function makeGlyphs(){
 glyphs=[];
 const d=Math.min(devicePixelRatio||1,1.5),font=Math.round(cw*.91);
 for(let v=0;v<10;v++){
  // Render glow once into each cached tile, not every animation frame.
  const tile=document.createElement('canvas');tile.width=Math.ceil(cw*d);tile.height=Math.ceil(ch*d);
  const g=tile.getContext('2d');g.scale(d,d);
  g.font=`${font}px monospace`;g.textAlign='center';g.textBaseline='middle';
  const light=v===0?18:Math.min(75,24+v*5.3);
  const saturation=v===0?38:Math.min(83,60+v*2);
  const ink=`hsl(${137-v*.5} ${saturation}% ${light}%)`;
  if(v>0){
   g.shadowColor=`hsla(136,95%,58%,${(.10+v*.045).toFixed(3)})`;
   g.shadowBlur=(.5+v*.30)*Math.min(1,cw/14);
  }
  g.fillStyle=ink;g.fillText(String(v),cw/2,ch/2);
  glyphs.push(tile);
 }
}
function showControls(){document.body.classList.remove('hidden');clearTimeout(hideTimer);hideTimer=setTimeout(()=>document.body.classList.add('hidden'),6500)}
c.addEventListener('click',showControls);
function resize(){W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,1.5);c.width=Math.round(W*d);c.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);cw=Math.max(9,Math.min(18,Math.round(W/88)));ch=Math.round(cw*1.36);const old=history,oldC=C;C=Math.ceil(W/cw);R=Math.ceil(H/ch)+2;history=old.slice(0,R).map(row=>Array.from({length:C},(_,i)=>row[Math.min(oldC-1,Math.floor(i*oldC/C))]||0));while(history.length<R)history.push(new Uint8Array(C));prevLevels=new Float32Array(C);floorLevels=new Float32Array(C);rawLevels=new Float32Array(C);blendedLevels=new Float32Array(C);makeGlyphs();glowCanvas.width=C;glowCanvas.height=R;glowImage=glowCtx.createImageData(C,R);glowPixels=glowImage.data;glowDirty=true;ctx.font=`${Math.round(cw*.91)}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle'}
addEventListener('resize',resize);resize();
function sample(){const row=new Uint8Array(C);
 if(analyser&&!demo){
  analyser.getFloatFrequencyData(data);
  const hz=audio.sampleRate/analyser.fftSize,max=Math.min(MAXHZ,audio.sampleRate*.47);
  // First measure each logarithmic band with the original v7 noise gate.
  for(let x=0;x<C;x++){
   const lo=MINHZ*Math.pow(max/MINHZ,x/C),hi=MINHZ*Math.pow(max/MINHZ,(x+1)/C);
   let a=Math.max(1,Math.ceil(lo/hz)),b=Math.min(data.length-1,Math.ceil(hi/hz)-1),peak=-120;
   if(a<=b){for(let k=a;k<=b;k++)peak=Math.max(peak,data[k])}
   else{let k=Math.min(data.length-1,Math.max(1,Math.round(Math.sqrt(lo*hi)/hz)));peak=data[k]}
   const level=Math.max(0,Math.min(1,(peak+83)/59));
   const baseline=floorLevels[x]=floorLevels[x]*.985+level*.015;
   const threshold=Math.max(.042,baseline*.264); // 20% stronger adaptive noise gate
   const cleaned=Math.max(0,(level-threshold)/(1-threshold));
   const transient=Math.max(0,cleaned-baseline*.50);
   // Preserve v9 amplification; blend smoothly across the former 209 Hz seam.
   const q=x/C;
   const blend=Math.min(1,Math.max(0,(q-.20)/.18));
   const smoothstep=blend*blend*(3-2*blend);
   const boost=1.42+(1.15-1.42)*smoothstep;
   rawLevels[x]=Math.max(0,Math.min(1,transient*boost));
  }
  // Frequency cohesion: a gentle Gaussian blend joins adjacent peaks without
  // flattening the true peak or smearing unrelated sounds across the screen.
  // The blend is slightly wider in the bass region.
  for(let x=0;x<C;x++){
   let sum=0,weightSum=0;
   // Exact v9 kernels outside the 20–38% transition; no hard bass seam.
   const t0=Math.min(1,Math.max(0,(x/C-.20)/.18));
   const t=t0*t0*(3-2*t0);
   const sigma=2.05+(1.20-2.05)*t;
   for(let dx=-4;dx<=4;dx++){
    const xx=x+dx;if(xx<0||xx>=C)continue;
    // The outer two taps fade away continuously toward the v9 treble kernel.
    const outer=Math.abs(dx)>2?1-t:1;
    if(outer<=0)continue;
    const w=Math.exp(-.5*(dx/sigma)**2)*outer;
    sum+=rawLevels[xx]*w;weightSum+=w;
   }
   const neighborMean=sum/weightSum;
   const mix=.56+(.36-.56)*t;
   blendedLevels[x]=rawLevels[x]*(1-mix)+neighborMean*mix;
  }
  for(let x=0;x<C;x++){
   const target=blendedLevels[x];
   const smooth=prevLevels[x]=target>prevLevels[x]?target*.68+prevLevels[x]*.32:target*.28+prevLevels[x]*.72;
   row[x]=Math.min(9,Math.round(Math.pow(smooth,1.03)*10));
  }
  return row;
 }
 if(!demo)return row;
 simTime+=PERIOD/1000;const beat=Math.pow(Math.max(0,Math.sin(simTime*5.1)),14),hat=Math.pow(Math.max(0,Math.sin(simTime*10.2+1)),18);
 for(let x=0;x<C;x++){const q=x/C;const bass=beat*9*Math.exp(-Math.pow((q-.13)/.065,2)),mid=(1+1.4*Math.sin(simTime*2+q*22))*Math.exp(-Math.pow((q-.48)/.13,2)),high=hat*9*Math.exp(-Math.pow((q-.82)/.065,2));row[x]=Math.max(0,Math.min(9,Math.round(bass+mid+high+(Math.random()-.5)*.3)))}return row}
function drawGlow(){
 // Smooth 2D convolution across neighbouring columns AND rows. Rendering the
 // tiny light field stretched with browser interpolation avoids costly blur
 // filters and keeps the edges soft, with no square cell boundaries.
 const weights=[.09,.23,.36,.23,.09];
 for(let y=0;y<R;y++)for(let x=0;x<C;x++){
  let energy=0;
  for(let dy=-2;dy<=2;dy++){
   const yy=y+dy;if(yy<0||yy>=R)continue;
   const row=history[yy];
   for(let dx=-2;dx<=2;dx++){
    const xx=x+dx;if(xx<0||xx>=C)continue;
    const v=row[xx];
    if(v<3)continue;
    energy+=weights[dy+2]*weights[dx+2]*Math.pow((v-2)/7,1.65);
   }
  }
  const idx=(y*C+x)*4;
  const a=Math.min(90,Math.round(energy*255*GLOW_STRENGTH));
  glowPixels[idx]=18;glowPixels[idx+1]=185;glowPixels[idx+2]=75;glowPixels[idx+3]=a;
 }
 glowCtx.putImageData(glowImage,0,0);
}
function draw(){ctx.fillStyle='#000000';ctx.fillRect(0,0,W,H);
 const offset=acc/PERIOD-1;
 if(glowDirty){drawGlow();glowDirty=false;}
 ctx.save();ctx.globalAlpha=1;ctx.imageSmoothingEnabled=true;
 // The glow is a diffuse background underneath all the original v5 glyphs.
 ctx.drawImage(glowCanvas,0,(offset-.5)*ch,C*cw,R*ch);
 ctx.restore();
 for(let y=0;y<history.length;y++){
  const yy=(y+offset)*ch;if(yy< -ch||yy>H+ch)continue;
  const row=history[y],fade=Math.max(.58,1-y/(R+14));
  for(let x=0;x<C;x++){const v=row[x];ctx.globalAlpha=fade*(v===0?.86:1);ctx.drawImage(glyphs[v],x*cw,yy,cw,ch)}
 }
 ctx.globalAlpha=1;
}
function frame(now){
 if(!last)last=now;
 acc+=Math.min(180,Math.max(0,now-last));last=now;
 if(acc>=PERIOD){
  // Read/analyze mic exactly once per render frame, even when catching up.
  // Repeat its row for skipped intervals without advancing the filters again.
  const row=sample(),n=Math.min(3,Math.floor(acc/PERIOD));
  for(let i=0;i<n;i++)history.unshift(i?row.slice():row);
  history.length=R;glowDirty=true;
  acc-=n*PERIOD;if(acc>=PERIOD)acc%=PERIOD;
 }
 draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
demoBtn.onclick=()=>{demo=!demo;demoBtn.textContent='Демо: '+(demo?'ВКЛ':'ВЫКЛ');status.textContent=demo?'Симуляция звука':analyser?'Микрофон активен':'Тишина — включи микрофон';showControls()};
mic.onclick=async()=>{showControls();mic.disabled=true;status.textContent='Запрашиваю разрешение…';
 try{if(!window.isSecureContext)throw Error('Открой сайт по HTTPS, а не файл из памяти');if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Error('Браузер не поддерживает микрофон. Попробуй Chrome.');
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});
 if(audio)await audio.close();audio=new (window.AudioContext||window.webkitAudioContext)();await audio.resume();
 analyser=audio.createAnalyser();analyser.fftSize=8192;analyser.smoothingTimeConstant=.12;analyser.minDecibels=-100;analyser.maxDecibels=-10;audio.createMediaStreamSource(stream).connect(analyser);data=new Float32Array(analyser.frequencyBinCount);
 demo=false;demoBtn.textContent='Демо: ВЫКЛ';mic.textContent='🎙 Микрофон ✓';status.textContent='Микрофон активен. Звук улавливается из комнаты.';
 // Display effective settings if Android exposes them; requested settings are not proof.
 const micSettings=stream.getAudioTracks()[0].getSettings?.()||{};
 const flags=[['EC','echoCancellation'],['NS','noiseSuppression'],['AGC','autoGainControl']]
  .map(([label,key])=>`${label}: ${typeof micSettings[key]==='boolean'?(micSettings[key]?'ВКЛ':'выкл'):'н/д'}`);
 status.textContent+=' '+flags.join(' · ');
 console.info('Matrix Spectrum v9.1 — microphone getSettings()',micSettings);
 stream.getAudioTracks()[0].onended=()=>{analyser=null;status.textContent='Микрофон отключён';showControls()}
 }catch(e){status.textContent='Ошибка: '+(e.name==='NotAllowedError'?'Нет разрешения. Разреши микрофон в настройках сайта.':e.message);console.error(e)}
 finally{mic.disabled=false;showControls()}};
full.onclick=async()=>{try{if(!document.fullscreenElement){if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else throw Error('В этом браузере полноэкранный режим недоступен')}else await document.exitFullscreen()}catch(e){status.textContent=e.message+' — попробуй «Добавить на главный экран».'}showControls()};
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
showControls();
</script></body></html>
