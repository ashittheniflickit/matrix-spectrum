  for(let x=0;x<C;x++){const v=row[x];ctx.globalAlpha=fade*(v===0?.86:1);ctx.drawImage(glyphs[v],x*cw,yy,cw,ch)}
 }
 ctx.globalAlpha=1;
}

// Spectral Flow v5 — continuous spatial envelope and stable phase. Matrix baseline unchanged.
// Source-informed design: nonoverlapping logarithmic max bands (PSCactux bins.ts),
// per-band attack/release memory (IUSV), optional onset from positive spectral
// flux (PSCactux onset.ts). Geometry is original, NOT copied from these projects.
let FLOW_BANDS=24;const FLOW_MAX_BANDS=64,FLOW_LINES=11,FLOW_SAMPLE_MS=40,FLOW_POINTS=144;
const flowTarget=new Float32Array(FLOW_MAX_BANDS),flowLevel=new Float32Array(FLOW_MAX_BANDS);
const flowPrevious=new Float32Array(FLOW_MAX_BANDS),flowPeaks=new Float32Array(FLOW_MAX_BANDS);
const flowY=new Float32Array(FLOW_POINTS),flowEnergy=new Float32Array(FLOW_POINTS);
const flowBandStarts=new Int32Array(FLOW_MAX_BANDS),flowBandEnds=new Int32Array(FLOW_MAX_BANDS);
const flowShape=new Float32Array(FLOW_POINTS),flowShapeEnergy=new Float32Array(FLOW_POINTS);
let flowShapeInitialized=false;
let flowBandRate=0,flowBandFft=0,flowPulse=0,flowLastOnset=-100;
const flowFluxHistory=[];
function resetFlowSpectrum(){
 FLOW_BANDS=settings.flow.bands;
 flowBandRate=0;flowBandFft=0;
 flowTarget.fill(0);flowLevel.fill(0);flowPrevious.fill(0);flowPeaks.fill(0);flowFluxHistory.length=0;flowPulse=0;
 flowY.fill(0);flowEnergy.fill(0);flowShape.fill(0);flowShapeEnergy.fill(0);flowShapeInitialized=false;
}
function flowBuildBands(){
 if(!analyser||!audio)return;
 const hz=audio.sampleRate/analyser.fftSize;
 const fmin=Math.max(MINHZ,hz),fmax=Math.min(MAXHZ,audio.sampleRate*.47);
 const ratio=fmax/fmin;
 let start=Math.max(1,Math.floor(fmin/hz));
 for(let i=0;i<FLOW_BANDS;i++){
  const edge=fmin*Math.pow(ratio,(i+1)/FLOW_BANDS);
  const maxEnd=data.length-(FLOW_BANDS-i-1);
  const end=Math.min(maxEnd,Math.max(start+1,Math.round(edge/hz)));
  flowBandStarts[i]=start;flowBandEnds[i]=end;start=end;
 }
 flowBandRate=audio.sampleRate;flowBandFft=analyser.fftSize;
}
function flowSpectrum(){
 if(analyser&&!demo){
  if(flowBandRate!==audio.sampleRate||flowBandFft!==analyser.fftSize||FLOW_BANDS!==settings.flow.bands){FLOW_BANDS=settings.flow.bands;flowBuildBands()}
  analyser.getFloatFrequencyData(data);
  for(let i=0;i<FLOW_BANDS;i++){
   let peak=-120;
   for(let k=flowBandStarts[i];k<flowBandEnds[i];k++)peak=Math.max(peak,data[k]);
   // Map calibrated Matrix noise profile on the same logarithmic frequency axis.
   let level=Math.max(0,Math.min(1,(peak+83)/59));
   if(noiseProfile&&!calibration){
    const f=(i+.5)*noiseProfile.db.length/FLOW_BANDS-.5;
    const a=Math.max(0,Math.min(noiseProfile.db.length-1,Math.floor(f)));
    const b=Math.min(noiseProfile.db.length-1,a+1),t=Math.max(0,Math.min(1,f-a));
    const floor=noiseProfile.db[a]*(1-t)+noiseProfile.db[b]*t;
    const gate=Math.max(0,Math.min(1,(peak-floor-NOISE_LOW_DB)/(NOISE_HIGH_DB-NOISE_LOW_DB)));
    level*=gate*gate*(3-2*gate);
   }
   flowTarget[i]=Math.pow(Math.max(0,(level-.085)/.915),1.0);
  }
 }else if(demo){
  const beat=Math.pow(Math.max(0,Math.sin(flowTime*4.4)),10);
  const hat=Math.pow(Math.max(0,Math.sin(flowTime*9.2+1)),14);
  for(let i=0;i<FLOW_BANDS;i++){
   const q=(i+.5)/FLOW_BANDS;
   flowTarget[i]=Math.min(1,beat*.94*Math.exp(-Math.pow((q-.15)/.07,2))+
    (.26+.22*Math.sin(flowTime*1.8))*Math.exp(-Math.pow((q-.52)/.085,2))+
    hat*.67*Math.exp(-Math.pow((q-.82)/.065,2)));
  }
 }else flowTarget.fill(0);
 // Lightweight spectral-flux onset detector: same documented principle as
 // PSCactux, but using our existing 24 bands and NO extra FFT analyser.
 let flux=0;
 for(let i=0;i<FLOW_BANDS;i++){
  flux+=Math.max(0,flowTarget[i]-flowPrevious[i]);
  flowPrevious[i]=flowTarget[i];
 }
 flux/=FLOW_BANDS;
 if(flowFluxHistory.length>=8){
  const sorted=flowFluxHistory.slice().sort((a,b)=>a-b);
  const median=sorted[Math.floor(sorted.length/2)];
  const dev=flowFluxHistory.map(v=>Math.abs(v-median)).sort((a,b)=>a-b);
  const mad=dev[Math.floor(dev.length/2)];
  if(flux>Math.max(.018,median*1.5+mad*3)&&flowTime-flowLastOnset>.12){
   flowPulse=Math.min(1,flowPulse+.30);flowLastOnset=flowTime;
  }
 }
 flowFluxHistory.push(flux);if(flowFluxHistory.length>43)flowFluxHistory.shift();
}
function flowUpdate(dt){
 const up=settings.flow.attack<=0?1:1-Math.exp(-dt/(settings.flow.attack/1000));
 const down=settings.flow.decay<=0?1:1-Math.exp(-dt/(settings.flow.decay/1000));
 for(let i=0;i<FLOW_BANDS;i++){
  const t=flowTarget[i],v=flowLevel[i];
  flowLevel[i]=v+(t-v)*(t>v?up:down);
 }
 flowPulse*=settings.flow.decay<=0?0:Math.exp(-dt/Math.max(.10,settings.flow.decay/1000));
}
// Stable spatial wave: NO discrete peak ownership and NO per-bin phase.
// Every band contributes continuously as its intensity changes. The phase is
// a continuous function of horizontal position, not of whichever bin happens
// to win this frame. This removes the large shape jumps seen in v4 during speech.
function flowBuildCurve(dt){
 const sigma=Math.max(.25,settings.flow.width/100);
 const groupStrength=settings.flow.grouping/100;
 // Neighbor grouping is a continuous positive Gaussian convolution. At 0%
 // each band keeps its individuality; at 300% the spectrum becomes broader.
 const neighborSigma=groupStrength*.90;
 for(let i=0;i<FLOW_BANDS;i++){
  if(neighborSigma<.05){flowPeaks[i]=flowLevel[i];continue}
  let total=0,weights=0;
  const span=Math.min(FLOW_BANDS-1,Math.ceil(neighborSigma*3));
  for(let j=Math.max(0,i-span);j<=Math.min(FLOW_BANDS-1,i+span);j++){
   const d=(i-j)/neighborSigma,w=Math.exp(-.5*d*d);
   total+=flowLevel[j]*w;weights+=w;
  }
  // A convex blend preserves original concentration at 100% while smoothing
  // continuously as grouping increases; no thresholded peak suppression.
  const mix=Math.min(.90,groupStrength*.38);
  flowPeaks[i]=flowLevel[i]*(1-mix)+(total/weights)*mix;
 }
 // Build a positive spatial envelope; signed displacement is applied AFTER
 // the envelope so adjacent bands never carry incompatible time phases.
 for(let p=0;p<FLOW_POINTS;p++){
  const x=p*(FLOW_BANDS-1)/(FLOW_POINTS-1);
  let sum=0,weightSum=0;
  for(let i=0;i<FLOW_BANDS;i++){
   const d=(x-i)/sigma;if(Math.abs(d)>4)continue;
   const w=Math.exp(-.5*d*d);
   sum+=flowPeaks[i]*w;weightSum+=w;
  }
  // For isolated tones preserve a local maximum, for multi-band material
  // prevent tall artificial peaks from adding many bands together.
  const envelope=weightSum?Math.min(1,sum/Math.max(1,weightSum)) : 0;
  const q=p/(FLOW_POINTS-1);
  const phase=flowTime*(1.36+.20*q)+q*2.20;
  const signed=Math.sin(phase);
  const target=Math.tanh(envelope*signed*.95);
  const energy=Math.min(1,envelope);
  if(!flowShapeInitialized){flowShape[p]=target;flowShapeEnergy[p]=energy}
  else{
   // Small frame-time compensated smoothing prevents sudden subpixel jumps
   // even if the input FFT changes bands between two consecutive frames.
   const tau=target*flowShape[p]>=0?.075:.105;
   const k=1-Math.exp(-dt/tau);
   flowShape[p]+=(target-flowShape[p])*k;
   flowShapeEnergy[p]+=(energy-flowShapeEnergy[p])*(1-Math.exp(-dt/.085));
  }
  flowY[p]=flowShape[p];flowEnergy[p]=flowShapeEnergy[p];
 }
 flowShapeInitialized=true;
}
// Shape-preserving piecewise cubic Hermite interpolation (PCHIP-style).
// Zero derivative at local extrema prevents polygonal corners and overshoot.
// Uses flowY values; frequency peaks stay at their measured heights.
function curveValueAt(f){
 const i=Math.max(0,Math.min(FLOW_POINTS-2,Math.floor(f))),t=Math.min(1,Math.max(0,f-i));
 const y0=flowY[i],y1=flowY[i+1],delta=y1-y0;
 const prev=i?y0-flowY[i-1]:delta,next=i+2<FLOW_POINTS?flowY[i+2]-y1:delta;
 function derivative(a,b){return a*b<=0?0:2*a*b/(a+b)}
 const m0=derivative(prev,delta),m1=derivative(delta,next);
 const t2=t*t,t3=t2*t;
 return (2*t3-3*t2+1)*y0+(t3-2*t2+t)*m0+(-2*t3+3*t2)*y1+(t3-t2)*m1;
}
function curveEnergyAt(f){const i=Math.max(0,Math.min(FLOW_POINTS-2,Math.floor(f))),t=Math.max(0,Math.min(1,f-i));return flowEnergy[i]*(1-t)+flowEnergy[i+1]*t;}
function drawFlow(dt){
 ctx.fillStyle='#000000';ctx.fillRect(0,0,W,H);
 flowBuildCurve(dt);
 if(!flowGradient||flowGradientWidth!==W){
  flowGradient=ctx.createLinearGradient(0,0,W,0);
  flowGradient.addColorStop(0,offsetHue('#159754'));flowGradient.addColorStop(.38,offsetHue('#3ce58a'));
  flowGradient.addColorStop(.7,offsetHue('#79ffb4'));flowGradient.addColorStop(1,offsetHue('#b0ffe0'));
  flowGradientWidth=W;
 }
 const amp=Math.min(H*.31,W*.22)*settings.flow.amplitude/100,spacing=Math.min(8.5,Math.max(3.8,H*.0075));
 const center=H*.51,left=-6,right=W+6,step=3;
 let mean=0;for(let i=0;i<FLOW_POINTS;i++)mean+=flowEnergy[i];mean/=FLOW_POINTS;
 ctx.lineCap='round';ctx.lineJoin='round';
 function ribbonPath(offset,scale){
  ctx.beginPath();let first=true;
  for(let x=left;x<=right+step;x+=step){
   const q=Math.max(0,Math.min(1,x/W)),f=q*(FLOW_POINTS-1);
   const bend=curveValueAt(f);
   const energy=curveEnergyAt(f);
   // Small coherent fiber separation, NOT another traveling sine wave.
   const offsetFactor=1+energy*.055;
   const y=center+offset*spacing*offsetFactor+bend*amp*scale*(1+flowPulse*.075);
   if(first){ctx.moveTo(x,y);first=false}else ctx.lineTo(x,y);
  }
 }
 ribbonPath(0,1);ctx.strokeStyle=offsetHue('#1bdc7a');ctx.globalAlpha=(.095+Math.min(.10,mean*.26))*settings.flow.glow/100;ctx.lineWidth=35;ctx.stroke();
 ribbonPath(0,1);ctx.strokeStyle=offsetHue('#37f99b');ctx.globalAlpha=(.10+Math.min(.10,mean*.3))*settings.flow.glow/100;ctx.lineWidth=17;ctx.stroke();
 for(let line=0;line<FLOW_LINES;line++){
  const u=(line-(FLOW_LINES-1)/2)/((FLOW_LINES-1)/2);
  ribbonPath(u*5,1-u*u*.075);
  ctx.strokeStyle=flowGradient;ctx.globalAlpha=(line===5?.91:.47)+Math.min(.13,mean*.32);
  ctx.lineWidth=line===5?1.8:1.0;ctx.stroke();
 }
 ctx.globalAlpha=1;
}
function setMode(next){
 viewMode=next;modeBtn.textContent=viewMode?'◈ Режим: Spectral Flow':'◈ Режим: Матрица';
 flowLast=0;flowAccumulator=0;flowTime=0;flowTarget.fill(0);flowLevel.fill(0);flowPrevious.fill(0);flowPulse=0;flowFluxHistory.length=0;flowBandRate=0;flowShape.fill(0);flowShapeEnergy.fill(0);flowShapeInitialized=false;
 if(!viewMode){last=0;acc=0;glowDirty=true}
 if(settingsOverlay.classList.contains('open'))buildSettingsUI();
 showControls();
}
modeBtn.onclick=()=>setMode(viewMode?0:1);
function frame(now){
 if(viewMode){
  if(!flowLast)flowLast=now;
  const dt=Math.min(.1,Math.max(0,(now-flowLast)/1000));flowLast=now;
  flowTime+=dt;flowAccumulator+=dt*1000;
  if(flowAccumulator>=FLOW_SAMPLE_MS){if(calibration)sample();flowSpectrum();flowAccumulator%=FLOW_SAMPLE_MS}
  flowUpdate(dt);drawFlow(dt);requestAnimationFrame(frame);return;
 }
 if(!last)last=now;
 acc+=Math.min(180,Math.max(0,now-last));last=now;
 if(acc>=PERIOD){
  // Read/analyze mic exactly once per render frame, even when catching up.
  // Repeat its row for skipped intervals without advancing the filters again.
  const row=sample(),n=Math.min(3,Math.floor(acc/PERIOD));
  for(let i=0;i<n;i++)history.unshift(i?row.slice():row);
  history.length=R;glowDirty=true;
  acc-=n*PERIOD;if(acc>=PERIOD)acc%=PERIOD;
 }
 draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
demoBtn.onclick=()=>{if(calibration){calibration=null;status.textContent='Калибровка отменена'}demo=!demo;demoBtn.textContent='Демо: '+(demo?'ВКЛ':'ВЫКЛ');status.textContent=demo?'Симуляция звука':analyser?'Микрофон активен'+(noiseProfile?' · шум откалиброван':''):'Тишина — включи микрофон';updateNoiseButtons();showControls()};
mic.onclick=async()=>{if(calibration)calibration=null;showControls();mic.disabled=true;status.textContent='Запрашиваю разрешение…';
 try{if(!window.isSecureContext)throw Error('Открой сайт по HTTPS, а не файл из памяти');if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Error('Браузер не поддерживает микрофон. Попробуй Chrome.');
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});
 if(audio)await audio.close();audio=new (window.AudioContext||window.webkitAudioContext)();await audio.resume();
 analyser=audio.createAnalyser();analyser.fftSize=8192;analyser.smoothingTimeConstant=.12;analyser.minDecibels=-100;analyser.maxDecibels=-10;audio.createMediaStreamSource(stream).connect(analyser);data=new Float32Array(analyser.frequencyBinCount);
 demo=false;demoBtn.textContent='Демо: ВЫКЛ';mic.textContent='🎙 Микрофон ✓';status.textContent='Микрофон активен. Звук улавливается из комнаты.';
 // Display effective settings if Android exposes them; requested settings are not proof.
 const micSettings=stream.getAudioTracks()[0].getSettings?.()||{};
 const flags=[['EC','echoCancellation'],['NS','noiseSuppression'],['AGC','autoGainControl']]
  .map(([label,key])=>`${label}: ${typeof micSettings[key]==='boolean'?(micSettings[key]?'ВКЛ':'выкл'):'н/д'}`);
 status.textContent+=' '+flags.join(' · ')+(noiseProfile?' · шум откалиброван':'');
 console.info('Matrix Spectrum / Spectral Flow — microphone getSettings()',micSettings);
 stream.getAudioTracks()[0].onended=()=>{analyser=null;calibration=null;status.textContent='Микрофон отключён';updateNoiseButtons();showControls()}
 }catch(e){status.textContent='Ошибка: '+(e.name==='NotAllowedError'?'Нет разрешения. Разреши микрофон в настройках сайта.':e.message);console.error(e)}
 finally{mic.disabled=false;updateNoiseButtons();showControls()}};
calBtn.onclick=()=>{
 if(!analyser||demo||calibration)return;
 calibration=[];calibrationStart=performance.now();
 status.textContent='Калибровка фона: 3 с. Не включай музыку и не говори.';
 updateNoiseButtons();showControls();
};
resetBtn.onclick=()=>{
 calibration=null;noiseProfile=null;
 try{localStorage.removeItem(NOISE_KEY)}catch(e){}
 status.textContent='Профиль шума сброшен. Работает обычная v9.1.';
 updateNoiseButtons();showControls();
};
updateNoiseButtons();
resetFlowSpectrum();applyColor();
full.onclick=async()=>{try{if(!document.fullscreenElement){if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else throw Error('В этом браузере полноэкранный режим недоступен')}else await document.exitFullscreen()}catch(e){status.textContent=e.message+' — попробуй «Добавить на главный экран».'}showControls()};
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
showControls();
